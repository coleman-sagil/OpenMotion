[package]
name = "openleap"
version = "0.1.0"
edition = "2021"
description = "Open-stack capture path for the original Leap Motion Controller: claim the device over libusb, replay leapd's extension-unit bring-up, stream the stereo IR bulk endpoint."

[lib]
name = "openleap"
# rlib: linked by the openleap binary. staticlib: libopenleap.a exporting the
# leap_open_* C ABI (src/ffi.rs), linked by the Monado leap_open driver.
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "openleap"
path = "src/main.rs"

[dependencies]
rusb = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
